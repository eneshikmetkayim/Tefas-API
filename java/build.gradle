plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'application'
}

application {
    mainClass = 'com.tefas.examples.BasicExample'
}

group = 'com.tefas'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'TEFAS API Client',
            'Implementation-Version': version
        )
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'TEFAS API Client'
                description = 'TEFAS (Türkiye Elektronik Fon Alım Satım Platformu) Pure-HTTP API Client for Java'
                url = 'https://github.com/eneshikmetkayim/Tefas-API'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
