[package]
name = "tefas-api"
version = "1.0.0"
edition = "2021"
description = "TEFAS (Türkiye Elektronik Fon Alım Satım Platformu) Pure-HTTP JSON API client"
license = "MIT"
repository = "https://github.com/eneshikmetkayim/Tefas-API"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
