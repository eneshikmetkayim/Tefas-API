version: 2
updates:
  - package-ecosystem: npm
    directory: /javascript
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 23.0.0"]
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /java
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
