name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate

  dotnet-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - name: Check vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive --format json > audit.json
          python3 - <<'EOF'
          import json, sys
          data = json.load(open("audit.json", encoding="utf-8"))
          vulns = []
          for proj in data.get("projects", []):
              for fw in proj.get("frameworks", []):
                  for key in ("topLevelPackages", "transitivePackages"):
                      for pkg in fw.get(key, []):
                          for v in pkg.get("vulnerabilities", []):
                              vulns.append((proj.get("path"), pkg.get("id"), pkg.get("resolvedVersion"), v.get("severity"), v.get("advisoryurl")))
          if vulns:
              for item in vulns:
                  print("VULNERABLE:", item)
              sys.exit(1)
          print("No vulnerable NuGet packages found.")
          EOF

  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
